<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Lorline Studio</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#14161C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --ink:#14161C;
    --panel:#1C1F29;
    --panel-2:#242836;
    --line:#31364433;
    --line-strong:#3A3F52;
    --paper:#EDEAE2;
    --slate:#8B90A0;
    --slate-dim:#5B6070;
    --teal:#4FD1C5;
    --teal-dim:#2E8B82;
    --amber:#E8A33D;
    --danger:#E8664F;
    --radius:14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
  }
  @font-face{
    font-family:'FrauncesFallback';
    src:local('Georgia');
  }
  .serif{ font-family:'Fraunces','Georgia',serif; }
  #app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }

  /* ---------- Header ---------- */
  header.topbar{
    display:flex; align-items:center; gap:10px;
    padding:calc(10px + var(--safe-top)) 14px 10px 14px;
    background:linear-gradient(180deg,#181B24,#14161C);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    z-index:20;
  }
  .btn-icon{
    width:36px;height:36px;border-radius:10px;border:none;background:transparent;
    color:var(--paper); font-size:20px; display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .btn-icon:active{ background:var(--panel-2); }
  .crumbwrap{ flex:1; min-width:0; }
  .crumb-eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--slate); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .crumb-title{ font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .save-pill{
    font-size:11px; color:var(--slate); display:flex; align-items:center; gap:5px; flex-shrink:0;
    padding:4px 9px; border-radius:99px; background:var(--panel-2);
  }
  .save-dot{ width:6px;height:6px;border-radius:50%; background:var(--teal); transition:opacity .2s; }
  .save-dot.saving{ background:var(--amber); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  main{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; position:relative; }

  /* ---------- Lists / cards ---------- */
  .list-pad{ padding:16px 14px calc(90px + var(--safe-bottom)) 14px; }
  .section-label{ font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--slate-dim); margin:18px 4px 8px; }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 15px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
    position:relative; overflow:hidden;
  }
  .card:active{ background:var(--panel-2); }
  .card .stripe{ position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--teal-dim); }
  .card.branch .stripe{ background:var(--amber); }
  .card-main{ flex:1; min-width:0; }
  .card-title{ font-size:15.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-sub{ font-size:12.5px; color:var(--slate); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-chevron{ color:var(--slate-dim); font-size:18px; flex-shrink:0; }
  .card-kebab{ color:var(--slate); font-size:20px; padding:6px 4px 6px 10px; flex-shrink:0; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--slate); }
  .empty-state .glyph{ font-size:34px; margin-bottom:10px; opacity:.6; }
  .empty-state .msg{ font-size:14px; line-height:1.5; max-width:280px; margin:0 auto; }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:18px; bottom:calc(22px + var(--safe-bottom)); z-index:30;
    width:56px;height:56px;border-radius:18px; border:none;
    background:var(--teal); color:#0B2320; font-size:26px; font-weight:600;
    box-shadow:0 8px 24px rgba(79,209,197,.35); display:flex; align-items:center; justify-content:center;
  }
  .fab:active{ transform:scale(.94); }
  .fab-secondary{
    position:fixed; right:86px; bottom:calc(22px + var(--safe-bottom)); z-index:30;
    width:52px;height:52px;border-radius:16px; border:1px solid var(--line-strong);
    background:var(--panel-2); color:var(--paper); font-size:19px;
    display:flex; align-items:center; justify-content:center;
  }
  .fab-secondary:active{ transform:scale(.94); }

  /* ---------- Tabs (subproject view) ---------- */
  .tabbar{ display:flex; gap:6px; padding:12px 14px 0; background:var(--ink); position:sticky; top:0; z-index:10; }
  .tab{
    flex:1; text-align:center; padding:9px 0; font-size:13.5px; font-weight:600; color:var(--slate);
    border-bottom:2px solid transparent; border-radius:10px 10px 0 0;
  }
  .tab.active{ color:var(--paper); border-bottom-color:var(--teal); background:var(--panel); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,11,15,.6); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-overlay.center{ align-items:center; padding:20px; }
  .modal-sheet{
    background:var(--panel); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + var(--safe-bottom)); border:1px solid var(--line-strong); border-bottom:none;
    max-height:85vh; overflow-y:auto;
  }
  .modal-overlay.center .modal-sheet{ border-radius:18px; border-bottom:1px solid var(--line-strong); max-height:80vh; }
  .modal-title{ font-size:17px; font-weight:700; margin-bottom:14px; }
  .field-label{ font-size:12px; color:var(--slate); margin:12px 0 6px; text-transform:uppercase; letter-spacing:.06em; }
  .field-label:first-of-type{ margin-top:0; }
  input[type=text], textarea, select{
    width:100%; background:var(--panel-2); border:1px solid var(--line-strong); color:var(--paper);
    border-radius:10px; padding:11px 12px; font-size:15px; font-family:inherit;
  }
  textarea{ resize:vertical; min-height:70px; }
  select{ appearance:none; }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn{
    flex:1; padding:12px 14px; border-radius:11px; border:none; font-size:14.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{ background:var(--teal); color:#0B2320; }
  .btn-ghost{ background:var(--panel-2); color:var(--paper); border:1px solid var(--line-strong); }
  .btn-danger{ background:var(--danger); color:#2A0B06; }
  .btn:active{ filter:brightness(.92); }
  .btn-row-vert{ display:flex; flex-direction:column; gap:9px; margin-top:6px; }
  .btn-row-vert .btn{ justify-content:flex-start; padding:13px 15px; }

  .type-choice{ display:flex; gap:10px; margin-top:6px; }
  .type-opt{ flex:1; border:1px solid var(--line-strong); border-radius:11px; padding:12px 10px; text-align:center; color:var(--slate); }
  .type-opt.sel{ border-color:var(--teal); color:var(--paper); background:rgba(79,209,197,.08); }
  .type-opt .ic{ font-size:20px; display:block; margin-bottom:4px; }

  /* ---------- Doc editor ---------- */
  .doc-toolbar{
    display:flex; gap:4px; padding:8px 10px; background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10; overflow-x:auto;
  }
  .tbtn{
    min-width:38px; height:38px; border-radius:9px; border:none; background:transparent; color:var(--paper);
    font-size:14px; font-weight:700; flex-shrink:0; display:flex;align-items:center;justify-content:center;
  }
  .tbtn.active{ background:var(--teal); color:#0B2320; }
  .tbtn:active{ background:var(--panel-2); }
  .tsep{ width:1px; background:var(--line-strong); margin:6px 4px; flex-shrink:0; }
  #docEditor{
    padding:22px 18px calc(60px + var(--safe-bottom)); min-height:60vh; outline:none;
    font-size:16.5px; line-height:1.65; font-family:'Fraunces','Georgia',serif;
  }
  #docEditor h1{ font-size:1.55em; margin:.6em 0 .3em; }
  #docEditor h2{ font-size:1.25em; margin:.6em 0 .3em; color:var(--teal); }
  #docEditor p{ margin:0 0 .9em; }
  #docEditor ul{ padding-left:1.3em; margin:0 0 .9em; }
  #docEditor ol{ padding-left:1.3em; margin:0 0 .9em; }
  #docEditor img{ max-width:100%; height:auto; border-radius:10px; margin:6px 0 14px; display:block; }
  #docEditor:empty:before{ content:attr(data-placeholder); color:var(--slate-dim); }

  /* ---------- Doc <-> flowchart link bar ---------- */
  .link-bar{
    display:flex; gap:8px; padding:9px 12px; background:var(--ink); overflow-x:auto;
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:9;
  }
  .link-chip{
    display:flex; align-items:center; gap:7px; background:var(--panel-2); border:1px solid var(--line-strong);
    border-radius:99px; padding:6px 8px 6px 12px; font-size:12px; color:var(--paper); white-space:nowrap; flex-shrink:0;
  }
  .link-chip .lbl{ max-width:46vw; overflow:hidden; text-overflow:ellipsis; }
  .link-chip .x{ color:var(--slate); font-size:15px; padding:2px 5px; }

  /* ---------- Script editor ---------- */
  .script-toolbar{
    display:flex; gap:4px; padding:8px 8px; background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10; overflow-x:auto; align-items:center;
  }
  .tbtn-wide{
    min-width:58px; height:42px; border-radius:9px; border:none; background:transparent; color:var(--slate);
    font-size:10.5px; font-weight:700; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    letter-spacing:.02em;
  }
  .tbtn-wide.active{ background:var(--teal); color:#0B2320; }
  .tbtn-wide:active{ background:var(--panel-2); }
  .script-page-wrap{ background:#2A2D38; padding:18px 10px 90px; min-height:100%; }
  #scriptEditor{
    outline:none; max-width:680px; margin:0 auto; background:#F7F5EF; color:#17181C;
    font-family:'Courier New', Courier, monospace; font-size:13.5px; line-height:1.7;
    padding:34px 8% 60px; border-radius:3px; box-shadow:0 6px 24px rgba(0,0,0,.35);
    min-height:70vh;
  }
  #scriptEditor div{ margin:0 0 12px; white-space:pre-wrap; word-break:break-word; }
  #scriptEditor .sh{ text-transform:uppercase; font-weight:700; }
  #scriptEditor .act{ }
  #scriptEditor .char{ text-transform:uppercase; margin-left:32%; font-weight:700; }
  #scriptEditor .dlg{ margin-left:16%; margin-right:12%; }
  #scriptEditor .paren{ margin-left:24%; margin-right:18%; font-style:italic; color:#51535c; }
  #scriptEditor .trans{ text-transform:uppercase; text-align:right; }
  #scriptEditor:empty:before{ content:attr(data-placeholder); color:#9a9a92; font-family:-apple-system,sans-serif; }
  #scriptEditor .dual{ display:flex; gap:14px; margin:0 0 12px; cursor:pointer; border:1px dashed transparent; border-radius:6px; padding:4px; }
  #scriptEditor .dual:hover{ border-color:#c8c6ba; }
  #scriptEditor .dual-col{ flex:1; min-width:0; }
  #scriptEditor .dual-col .char{ margin-left:0; text-align:center; }
  #scriptEditor .dual-col .dlg{ margin-left:4%; margin-right:4%; }
  .sp-autocomplete{
    position:fixed; z-index:300; background:#1C1F29; border:1px solid var(--line-strong); border-radius:10px;
    box-shadow:0 10px 28px rgba(0,0,0,.4); overflow:hidden; min-width:140px; max-width:70vw;
  }
  .sp-autocomplete-item{ padding:10px 14px; font-size:13px; color:var(--paper); font-family:-apple-system,sans-serif; }
  .sp-autocomplete-item:active{ background:var(--teal); color:#0B2320; }

  /* ---------- A/V split script format ---------- */
  #avEditor{
    outline:none; max-width:760px; margin:0 auto; background:#F7F5EF; color:#17181C;
    font-family:-apple-system,Helvetica,Arial,sans-serif; font-size:13px; line-height:1.55;
    border-radius:3px; box-shadow:0 6px 24px rgba(0,0,0,.35); min-height:70vh; padding-bottom:40px;
  }
  #avEditor .avheader{ display:flex; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#51535c; border-bottom:2px solid #17181C; padding:14px 4% 8px; }
  #avEditor .avheader .avh-left, #avEditor .avheader .avh-right{ flex:1; padding:0 2%; }
  #avEditor .avrow{ display:flex; border-bottom:1px solid #d9d7cc; }
  #avEditor .avcell-left, #avEditor .avcell-right{ flex:1; min-width:0; padding:10px 2%; white-space:pre-wrap; word-break:break-word; }
  #avEditor .avcell-left{ border-right:1px solid #d9d7cc; }
  #avEditor .avcell-right .char{ text-transform:uppercase; font-weight:700; margin-bottom:3px; }
  #avEditor:empty:before{ content:attr(data-placeholder); color:#9a9a92; font-family:-apple-system,sans-serif; }

  /* ---------- Flowchart ---------- */
  .flow-toolbar{
    display:flex; gap:8px; padding:10px 12px; background:var(--panel); border-bottom:1px solid var(--line);
    overflow-x:auto; position:sticky; top:0; z-index:10;
  }
  .flow-toolbar .btn{ flex:none; padding:9px 13px; font-size:13px; }
  .flow-canvas-wrap{ position:relative; overflow:auto; height:calc(100% - 0px); touch-action:pan-x pan-y; background:
    radial-gradient(circle, #262B39 1px, transparent 1px) 0 0/22px 22px, var(--ink); }
  svg#flowSvg{ display:block; }
  .fnode{ cursor:grab; }
  .fnode:active{ cursor:grabbing; }
  .fnode rect, .fnode polygon{ stroke-width:1.6; }
  .fnode.scene rect{ fill:#232838; stroke:#3E4560; }
  .fnode.branch polygon{ fill:#2E2618; stroke:var(--amber); }
  .fnode.selected rect, .fnode.selected polygon{ stroke:var(--teal); stroke-width:2.4; }
  .fnode text{ fill:var(--paper); font-size:13px; font-family:-apple-system,Roboto,sans-serif; pointer-events:none; }
  .fnode .flabel-sub{ fill:var(--slate); font-size:10.5px; }
  .fedge-line{ stroke:#4A5170; stroke-width:1.8; fill:none; }
  .fedge-hit{ stroke:transparent; stroke-width:18; fill:none; }
  .fedge-line.selected{ stroke:var(--teal); stroke-width:2.4; }
  .fedge-label{ fill:var(--slate); font-size:11px; font-family:-apple-system,Roboto,sans-serif; }
  .fedge-label-bg{ fill:var(--ink); }
  .linked-badge{ fill:var(--teal); }
  .connect-banner{
    position:sticky; top:0; z-index:15; background:var(--teal); color:#0B2320; font-weight:700; font-size:13px;
    text-align:center; padding:9px; display:none;
  }
  .connect-banner.show{ display:block; }

  /* ---------- Print ---------- */
  #printArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block !important; position:absolute; left:0; top:0; width:100%; padding:20px; color:#000; background:#fff; }
    #printArea h1{ font-family:Georgia,serif; }
    #printArea img{ max-width:100%; }
  }

  .toast{
    position:fixed; left:50%; bottom:calc(30px + var(--safe-bottom)); transform:translateX(-50%);
    background:#2A2E3C; border:1px solid var(--line-strong); color:var(--paper); padding:10px 18px;
    border-radius:99px; font-size:13.5px; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  ::selection{ background:rgba(79,209,197,.35); }
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";

/* ============================================================
   STORAGE
============================================================ */
var STORAGE_KEY = "lorline_studio_v1";
var state = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function now(){ return Date.now(); }

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error("load failed", e); }
  return { projects: [] };
}

var saveTimer = null;
function scheduleSave(){
  var dot = document.getElementById("saveDot");
  var lbl = document.getElementById("saveLbl");
  if(dot){ dot.classList.add("saving"); }
  if(lbl){ lbl.textContent = "Saving…"; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      showToast("Storage full — export and clear old work");
    }
    var d = document.getElementById("saveDot");
    var l = document.getElementById("saveLbl");
    if(d) d.classList.remove("saving");
    if(l) l.textContent = "Saved";
  }, 400);
}

/* ============================================================
   TOAST
============================================================ */
var toastTimer = null;
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

/* ============================================================
   IMAGE HELPERS (shared by doc editor and flowchart nodes)
============================================================ */
// Reads a File, downscales it on a canvas, and resolves a compressed
// JPEG data URL plus its final pixel dimensions. Keeps localStorage usage sane.
function readAndCompressImage(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error("read failed")); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error("decode failed")); };
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var outW = Math.max(1, Math.round(w*scale));
        var outH = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement("canvas");
        canvas.width = outW; canvas.height = outH;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, outW, outH);
        var dataUrl = canvas.toDataURL("image/jpeg", quality||0.85);
        resolve({ dataUrl:dataUrl, width:outW, height:outH });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function dataUrlToBytes(dataUrl){
  var parts = dataUrl.split(",");
  var meta = parts[0];
  var b64 = parts[1];
  var mime = (meta.match(/data:([^;]+);/)||[])[1] || "image/jpeg";
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return { bytes:bytes, mime:mime };
}

/* ============================================================
   NAV STATE
============================================================ */
var nav = { screen: "home", projectId:null, subprojectId:null, docId:null, flowchartId:null };
var navStack = [];

function goTo(next){
  navStack.push(JSON.parse(JSON.stringify(nav)));
  nav = Object.assign({}, nav, next);
  render();
}
function goBack(){
  if(navStack.length){
    nav = navStack.pop();
  } else {
    nav = { screen:"home", projectId:null, subprojectId:null, docId:null, flowchartId:null };
  }
  render();
}

/* ============================================================
   DATA HELPERS
============================================================ */
function getProject(id){ return state.projects.find(function(p){ return p.id===id; }); }
function getSub(proj, id){ return proj.subprojects.find(function(s){ return s.id===id; }); }
function getDoc(sub, id){ return sub.docs.find(function(d){ return d.id===id; }); }
function getFlow(sub, id){ return sub.flowcharts.find(function(f){ return f.id===id; }); }

function touch(obj){ obj.updatedAt = now(); }

function fmtDate(ts){
  if(!ts) return "";
  var d = new Date(ts);
  var opts = { month:"short", day:"numeric" };
  var today = new Date();
  if(d.toDateString()===today.toDateString()){
    return d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  }
  return d.toLocaleDateString([], opts);
}

/* ============================================================
   ELEMENT HELPERS
============================================================ */
function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else if(k.indexOf("on")===0 && typeof attrs[k]==="function") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if(children) children.forEach(function(c){ if(c) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
function svgEl(tag, attrs){
  var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if(attrs) for(var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

/* ============================================================
   MODAL SYSTEM
============================================================ */
function openModal(opts){
  // opts: {title, fields:[{key,label,type,value,options}], actions:[{label,style,onClick(values)}], center}
  var overlay = el("div", { class:"modal-overlay" + (opts.center?" center":"") });
  var sheet = el("div", { class:"modal-sheet" });
  sheet.appendChild(el("div", { class:"modal-title" }, [opts.title]));
  var inputs = {};
  (opts.fields||[]).forEach(function(f){
    sheet.appendChild(el("div", { class:"field-label" }, [f.label]));
    var input;
    if(f.type==="textarea"){
      input = el("textarea", { rows: f.rows||3 });
      input.value = f.value||"";
    } else if(f.type==="select"){
      input = el("select", {});
      (f.options||[]).forEach(function(o){
        var opt = el("option", { value:o.value }, [o.label]);
        if(o.value===f.value) opt.selected = true;
        input.appendChild(opt);
      });
    } else {
      input = el("input", { type:"text" });
      input.value = f.value||"";
    }
    inputs[f.key] = input;
    sheet.appendChild(input);
  });
  if(opts.body) sheet.appendChild(opts.body);
  var actionsWrap = el("div", { class: opts.vertical ? "btn-row-vert" : "modal-actions" });
  (opts.actions||[]).forEach(function(a){
    var values = {};
    var btn = el("button", { class:"btn " + (a.style||"btn-ghost"), onclick:function(){
      for(var k in inputs) values[k] = inputs[k].value;
      var res = a.onClick ? a.onClick(values) : undefined;
      if(res !== false) close();
    }}, [a.label]);
    actionsWrap.appendChild(btn);
  });
  sheet.appendChild(actionsWrap);
  overlay.appendChild(sheet);
  function close(){ document.body.removeChild(overlay); }
  overlay.addEventListener("click", function(e){ if(e.target===overlay) close(); });
  document.body.appendChild(overlay);
  var firstInput = sheet.querySelector("input,textarea");
  if(firstInput){ setTimeout(function(){ firstInput.focus(); if(firstInput.select) firstInput.select(); }, 60); }
  return close;
}

function reassignProjectIds(project){
  var np = { id:uid(), name:project.name || "Imported project", updatedAt:now(), subprojects:[] };
  (project.subprojects||[]).forEach(function(s){
    var docIdMap = {};
    var ns = { id:uid(), name:s.name || "Untitled", updatedAt:now(), docs:[], flowcharts:[] };
    (s.docs||[]).forEach(function(d){
      var nd = { id:uid(), title:d.title||"Untitled page", html:d.html||"", kind:d.kind||"page", updatedAt:now() };
      docIdMap[d.id] = nd.id;
      ns.docs.push(nd);
    });
    (s.flowcharts||[]).forEach(function(f){
      var nodeIdMap = {};
      var nf = { id:uid(), title:f.title||"Untitled flowchart", updatedAt:now(), nodes:[], edges:[] };
      (f.nodes||[]).forEach(function(n){
        var nn = Object.assign({}, n, {
          id:uid(),
          linkedDocId: n.linkedDocId ? (docIdMap[n.linkedDocId] || null) : null
        });
        nodeIdMap[n.id] = nn.id;
        nf.nodes.push(nn);
      });
      (f.edges||[]).forEach(function(e){
        if(nodeIdMap[e.from] && nodeIdMap[e.to]){
          nf.edges.push({ id:uid(), from:nodeIdMap[e.from], to:nodeIdMap[e.to], label:e.label||"" });
        }
      });
      ns.flowcharts.push(nf);
    });
    np.subprojects.push(ns);
  });
  return np;
}

function importProjectFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    var obj;
    try{ obj = JSON.parse(reader.result); }
    catch(e){ showToast("Couldn't read that file — is it a Lorline project export?"); return; }
    if(!obj || typeof obj.name !== "string" || !Array.isArray(obj.subprojects)){
      showToast("That doesn't look like a Lorline project file");
      return;
    }
    var imported = reassignProjectIds(obj);
    state.projects.push(imported);
    scheduleSave();
    showToast("Imported \"" + imported.name + "\"");
    render();
  };
  reader.onerror = function(){ showToast("Couldn't read that file"); };
  reader.readAsText(file);
}

function linkDocToFlowModal(s, d){
  if(s.flowcharts.length===0){ showToast("Create a flowchart in this project first"); return; }
  var flowSelect = el("select", {});
  s.flowcharts.forEach(function(f){
    flowSelect.appendChild(el("option", { value:f.id }, [f.title||"Untitled flowchart"]));
  });
  var nodeSelect = el("select", {});
  function refreshNodeOptions(){
    clear(nodeSelect);
    var f = s.flowcharts.find(function(x){ return x.id===flowSelect.value; });
    if(!f || f.nodes.length===0){
      nodeSelect.appendChild(el("option", { value:"" }, ["No nodes in this flowchart yet"]));
      return;
    }
    f.nodes.forEach(function(n){
      var label = (n.type==="branch"?"◇ ":"▭ ") + (n.text||"node").slice(0,30) + (n.linkedDocId===d.id ? " (linked here)" : n.linkedDocId ? " (linked elsewhere)" : "");
      nodeSelect.appendChild(el("option", { value:n.id }, [label]));
    });
  }
  flowSelect.addEventListener("change", refreshNodeOptions);
  refreshNodeOptions();
  var body = el("div", {}, [
    el("div", { class:"field-label" }, ["Flowchart"]), flowSelect,
    el("div", { class:"field-label" }, ["Node"]), nodeSelect
  ]);
  openModal({
    title:"Link \"" + (d.title||"this page") + "\" to a node",
    body: body,
    vertical:true,
    actions:[
      { label:"Cancel", style:"btn-ghost" },
      { label:"Link", style:"btn-primary", onClick:function(){
        var f = s.flowcharts.find(function(x){ return x.id===flowSelect.value; });
        var n = f && f.nodes.find(function(x){ return x.id===nodeSelect.value; });
        if(!f || !n){ showToast("Pick a node to link"); return false; }
        n.linkedDocId = d.id;
        touch(f); touch(s); scheduleSave();
        showToast("Linked to \"" + (n.text||"node") + "\"");
        render();
      }}
    ]
  });
}

/* ---- Screenplay format (single column, industry-style page) ---- */
function screenScriptplay(root, s, d){
  renderHeader(root, {
    eyebrow: s.name, title: d.title || "Untitled script", back:true, savePill:true,
    actions:[{ icon:"⇩", onClick:function(){ exportDocModal(d); } }, { icon:"⋮", onClick:function(){ docMenu(s, d); } }]
  });

  var toolbar = el("div", { class:"script-toolbar" });
  var typeBtns = {};
  SCRIPT_TYPES.forEach(function(t){
    var b = el("button", { class:"tbtn-wide", onclick:function(){ setBlockType(t); } }, [SCRIPT_LABELS[t]]);
    typeBtns[t] = b;
    toolbar.appendChild(b);
  });
  toolbar.appendChild(el("div",{class:"tsep"}));
  var dualBtn = el("button", { class:"tbtn-wide", onclick:function(){ openDualDialogueModal(null); } }, ["⇄ Dual"]);
  toolbar.appendChild(dualBtn);
  root.appendChild(toolbar);

  var linkedNodes = findLinkedFlowNodes(s, d.id);
  if(linkedNodes.length){
    root.appendChild(buildLinkBar(s, linkedNodes));
  }

  var main = el("main");
  var pageWrap = el("div", { class:"script-page-wrap" });
  var editor = el("div", { id:"scriptEditor", contenteditable:"true", spellcheck:"true" });
  if(d.html && d.html.trim()){
    editor.innerHTML = d.html;
  } else {
    var starter = document.createElement("div");
    starter.className = "sh";
    starter.innerHTML = "<br>";
    editor.appendChild(starter);
  }
  pageWrap.appendChild(editor);
  main.appendChild(pageWrap);
  root.appendChild(main);

  var typingTimer = null;
  function onScriptChange(){
    d.html = editor.innerHTML;
    touch(d); touch(s);
    scheduleSave();
  }
  editor.addEventListener("input", function(){
    clearTimeout(typingTimer);
    typingTimer = setTimeout(onScriptChange, 250);
    maybeShowAutocomplete();
  });

  function getCurrentBlock(){
    var sel = window.getSelection();
    if(!sel.rangeCount) return null;
    var node = sel.getRangeAt(0).startContainer;
    while(node && node!==editor && node.parentNode!==editor){ node = node.parentNode; }
    return (node && node!==editor && node.parentNode===editor) ? node : null;
  }
  function placeCaretAtEnd(node){
    var range = document.createRange();
    range.selectNodeContents(node);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  function refreshActiveTypeBtn(type){
    Object.keys(typeBtns).forEach(function(k){ typeBtns[k].classList.toggle("active", k===type); });
  }
  function updateActiveFromCursor(){
    var cur = getCurrentBlock();
    refreshActiveTypeBtn(cur ? (cur.className||"act") : (editor.lastElementChild ? (editor.lastElementChild.className||"act") : "sh"));
  }

  function setBlockType(type){
    editor.focus();
    var cur = getCurrentBlock();
    if(!cur){
      cur = editor.lastElementChild;
    }
    if(!cur){
      cur = document.createElement("div");
      cur.innerHTML = "<br>";
      editor.appendChild(cur);
    }
    cur.className = type;
    placeCaretAtEnd(cur);
    refreshActiveTypeBtn(type);
    onScriptChange();
  }

  /* ---- Character / scene / transition autocomplete ---- */
  var MATCHABLE_TYPES = ["char","sh","trans"];
  var autocompleteBox = null;
  function closeAutocomplete(){
    if(autocompleteBox){ autocompleteBox.remove(); autocompleteBox = null; }
  }
  function collectKnownValues(type){
    var seen = {}; var out = [];
    editor.querySelectorAll("."+type).forEach(function(elm){
      var v = (elm.textContent||"").trim();
      if(v && !seen[v.toLowerCase()]){ seen[v.toLowerCase()] = true; out.push(v); }
    });
    return out;
  }
  function maybeShowAutocomplete(){
    var cur = getCurrentBlock();
    var type = cur ? cur.className : null;
    if(!cur || MATCHABLE_TYPES.indexOf(type)<0){ closeAutocomplete(); return; }
    var text = (cur.textContent||"").trim();
    closeAutocomplete();
    if(!text) return;
    var matches = collectKnownValues(type).filter(function(v){
      return v.toLowerCase().indexOf(text.toLowerCase())===0 && v.toLowerCase()!==text.toLowerCase();
    }).slice(0,5);
    if(matches.length===0) return;
    autocompleteBox = el("div", { class:"sp-autocomplete" });
    matches.forEach(function(val){
      var item = el("div", { class:"sp-autocomplete-item" }, [val]);
      item.addEventListener("mousedown", function(ev){
        ev.preventDefault();
        cur.textContent = val;
        placeCaretAtEnd(cur);
        closeAutocomplete();
        onScriptChange();
      });
      autocompleteBox.appendChild(item);
    });
    var rect = cur.getBoundingClientRect();
    autocompleteBox.style.left = Math.max(8, rect.left) + "px";
    autocompleteBox.style.top = (rect.bottom + 4) + "px";
    document.body.appendChild(autocompleteBox);
  }

  editor.addEventListener("keydown", function(e){
    if(e.key==="Enter" && !e.shiftKey){
      e.preventDefault();
      closeAutocomplete();
      var cur = getCurrentBlock();
      var curType = cur ? (cur.className||"act") : "act";
      var nextType = SCRIPT_NEXT_TYPE[curType] || "act";
      var div = document.createElement("div");
      div.className = nextType;
      div.innerHTML = "<br>";
      if(cur && cur.parentNode===editor){
        cur.parentNode.insertBefore(div, cur.nextSibling);
      } else {
        editor.appendChild(div);
      }
      placeCaretAtEnd(div);
      refreshActiveTypeBtn(nextType);
      onScriptChange();
    } else if(e.key==="Escape"){
      closeAutocomplete();
    }
  });
  editor.addEventListener("keyup", updateActiveFromCursor);
  editor.addEventListener("mouseup", updateActiveFromCursor);
  editor.addEventListener("touchend", function(){ setTimeout(updateActiveFromCursor, 30); });
  editor.addEventListener("blur", function(){ setTimeout(closeAutocomplete, 150); });
  updateActiveFromCursor();

  /* ---- Dual dialogue (inserted/edited via a small form; not typed inline) ---- */
  function buildDualBlockElement(charA, dlgA, charB, dlgB){
    var wrap = document.createElement("div");
    wrap.className = "dual";
    wrap.contentEditable = "false";
    wrap.setAttribute("data-chara", charA);
    wrap.setAttribute("data-dlga", dlgA);
    wrap.setAttribute("data-charb", charB);
    wrap.setAttribute("data-dlgb", dlgB);
    function col(ch, dl){
      var c = document.createElement("div");
      c.className = "dual-col";
      var cEl = document.createElement("div"); cEl.className = "char"; cEl.textContent = ch || "CHARACTER";
      var dEl = document.createElement("div"); dEl.className = "dlg"; dEl.textContent = dl || "";
      c.appendChild(cEl); c.appendChild(dEl);
      return c;
    }
    wrap.appendChild(col(charA, dlgA));
    wrap.appendChild(col(charB, dlgB));
    return wrap;
  }
  function openDualDialogueModal(existingEl){
    var insertAfter = existingEl ? null : getCurrentBlock();
    var charA = el("input", { type:"text", value: existingEl ? existingEl.getAttribute("data-chara") : "" });
    var dlgA = el("textarea", { rows:3 });
    dlgA.value = existingEl ? existingEl.getAttribute("data-dlga") : "";
    var charB = el("input", { type:"text", value: existingEl ? existingEl.getAttribute("data-charb") : "" });
    var dlgB = el("textarea", { rows:3 });
    dlgB.value = existingEl ? existingEl.getAttribute("data-dlgb") : "";
    var body = el("div", {}, [
      el("div",{class:"field-label"},["Character A"]), charA,
      el("div",{class:"field-label"},["Dialogue A"]), dlgA,
      el("div",{class:"field-label"},["Character B"]), charB,
      el("div",{class:"field-label"},["Dialogue B"]), dlgB
    ]);
    var actions = [
      { label:"Cancel", style:"btn-ghost" },
      { label:"Save", style:"btn-primary", onClick:function(){
        var newEl = buildDualBlockElement(charA.value.trim(), dlgA.value.trim(), charB.value.trim(), dlgB.value.trim());
        if(existingEl && existingEl.parentNode){
          existingEl.parentNode.replaceChild(newEl, existingEl);
        } else if(insertAfter && insertAfter.parentNode===editor){
          insertAfter.parentNode.insertBefore(newEl, insertAfter.nextSibling);
        } else {
          editor.appendChild(newEl);
        }
        onScriptChange();
      }}
    ];
    if(existingEl){
      actions.push({ label:"Remove", style:"btn-danger", onClick:function(){
        if(existingEl.parentNode) existingEl.parentNode.removeChild(existingEl);
        onScriptChange();
      }});
    }
    openModal({ title:"Dual dialogue", body:body, vertical:true, actions:actions });
  }
  editor.addEventListener("click", function(e){
    var dualEl = e.target.closest ? e.target.closest(".dual") : null;
    if(dualEl) openDualDialogueModal(dualEl);
  });
}

      if(node.nodeType===1 && (node.className==="avcell-left" || node.className==="avcell-right")) return node;
      node = node.parentNode;

function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
  showToast("Exported " + filename);
}
function safeFilename(name){ return (name||"untitled").replace(/[^a-z0-9\-_ ]/gi,"").trim().replace(/\s+/g,"-") || "untitled"; }

function exportDocTxt(d){
  var tmp = document.createElement("div");
  tmp.innerHTML = d.html || "";
  var lines = [];
  tmp.childNodes.forEach(function(n){
    if(n.nodeType!==1){ return; }
    if(n.nodeName==="UL"){
      n.querySelectorAll("li").forEach(function(li){ lines.push("• " + (li.textContent||"").trim()); });
    } else if(n.nodeName==="OL"){
      var i=1;
      n.querySelectorAll("li").forEach(function(li){ lines.push((i++) + ". " + (li.textContent||"").trim()); });
    } else if(n.nodeName==="IMG"){
      lines.push("[Image]");
    } else {
      lines.push((n.textContent||"").trim());
    }
  });
  var text = (d.title||"Untitled page") + "\n\n" + lines.join("\n");
  downloadBlob(new Blob([text], {type:"text/plain"}), safeFilename(d.title) + ".txt");
}

/* ============================================================
   ZIP WRITER (pure JS, store/no-compression) — for DOCX export
============================================================ */
var CRC_TABLE = (function(){
  var t = [];
  for(var n=0;n<256;n++){
    var c = n;
    for(var k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n] = c>>>0;
  }
  return t;
})();
function crc32(bytes){
  var crc = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++) crc = (crc>>>8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function strToBytes(str){ return new TextEncoder().encode(str); }
function u16a(n){ return new Uint8Array([n & 0xFF, (n>>>8) & 0xFF]); }
function u32a(n){ return new Uint8Array([n & 0xFF, (n>>>8) & 0xFF, (n>>>16) & 0xFF, (n>>>24) & 0xFF]); }
function concatBytes(arrs){
  var total = 0;
  arrs.forEach(function(a){ total += a.length; });
  var out = new Uint8Array(total);
  var off = 0;
  arrs.forEach(function(a){ out.set(a, off); off += a.length; });
  return out;
}

function ZipWriter(){ this.entries = []; }
ZipWriter.prototype.addFile = function(name, content){
  var data = typeof content === "string" ? strToBytes(content) : content;
  var nameBytes = strToBytes(name);
  var crc = crc32(data);
  this.entries.push({ name:name, nameBytes:nameBytes, data:data, crc:crc });
};
ZipWriter.prototype.build = function(){
  var parts = [];
  var offset = 0;
  var centralParts = [];
  var self = this;
  this.entries.forEach(function(entry){
    var localHeader = concatBytes([
      u32a(0x04034b50), u16a(20), u16a(0), u16a(0),
      u16a(0), u16a(0x21), // time/date dummy
      u32a(entry.crc), u32a(entry.data.length), u32a(entry.data.length),
      u16a(entry.nameBytes.length), u16a(0),
      entry.nameBytes
    ]);
    entry.offset = offset;
    parts.push(localHeader, entry.data);
    offset += localHeader.length + entry.data.length;
  });
  this.entries.forEach(function(entry){
    var central = concatBytes([
      u32a(0x02014b50), u16a(20), u16a(20), u16a(0),
      u16a(0), u16a(0), u16a(0x21),
      u32a(entry.crc), u32a(entry.data.length), u32a(entry.data.length),
      u16a(entry.nameBytes.length), u16a(0), u16a(0),
      u16a(0), u16a(0), u32a(0),
      u32a(entry.offset),
      entry.nameBytes
    ]);
    centralParts.push(central);
  });
  var centralSize = 0;
  centralParts.forEach(function(c){ centralSize += c.length; });
  var centralOffset = offset;
  var eocd = concatBytes([
    u32a(0x06054b50), u16a(0), u16a(0),
    u16a(self.entries.length), u16a(self.entries.length),
    u32a(centralSize), u32a(centralOffset), u16a(0)
  ]);
  var all = parts.concat(centralParts, [eocd]);
  return new Blob(all, { type:"application/zip" });
};

/* ---- HTML (contenteditable) -> DOCX paragraphs ---- */
function xmlEscape(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function domToParagraphs(root){
  var paras = [];
  function walkInline(node, fmt, runs){
    if(node.nodeType===3){
      if(node.textContent) runs.push({ text:node.textContent, bold:fmt.bold, italic:fmt.italic, underline:fmt.underline });
      return;
    }
    if(node.nodeType!==1) return;
    var tag = node.nodeName;
    var nf = Object.assign({}, fmt);
    if(tag==="B"||tag==="STRONG") nf.bold = true;
    if(tag==="I"||tag==="EM") nf.italic = true;
    if(tag==="U") nf.underline = true;
    if(tag==="BR"){ runs.push({ text:"\n", bold:fmt.bold, italic:fmt.italic, underline:fmt.underline }); return; }
    node.childNodes.forEach(function(c){ walkInline(c, nf, runs); });
  }
  function pushBlock(node, style, numId){
    var runs = [];
    walkInline(node, {}, runs);
    if(runs.length===0) runs.push({ text:"" });
    paras.push({ style:style, runs:runs, numId:numId||null });
  }
  function imgParaFrom(node){
    return {
      type:"image",
      src: node.getAttribute("src"),
      width: parseInt(node.getAttribute("width"),10) || 400,
      height: parseInt(node.getAttribute("height"),10) || 300
    };
  }
  // Handles a P/DIV that may contain a mix of text and <img> tags, splitting
  // into separate text paragraphs and image paragraphs in document order.
  function pushMixedBlock(node, style, numId){
    var runBuffer = [];
    function flush(){
      if(runBuffer.length){
        paras.push({ style:style, runs:runBuffer, numId:numId||null });
        runBuffer = [];
      }
    }
    function walk(n, fmt){
      if(n.nodeType===3){
        if(n.textContent) runBuffer.push({ text:n.textContent, bold:fmt.bold, italic:fmt.italic, underline:fmt.underline });
        return;
      }
      if(n.nodeType!==1) return;
      if(n.nodeName==="IMG"){
        flush();
        paras.push(imgParaFrom(n));
        return;
      }
      var tag = n.nodeName;
      var nf = Object.assign({}, fmt);
      if(tag==="B"||tag==="STRONG") nf.bold = true;
      if(tag==="I"||tag==="EM") nf.italic = true;
      if(tag==="U") nf.underline = true;
      if(tag==="BR"){ runBuffer.push({ text:"\n", bold:fmt.bold, italic:fmt.italic, underline:fmt.underline }); return; }
      n.childNodes.forEach(function(c){ walk(c, nf); });
    }
    walk(node, {});
    flush();
  }
  root.childNodes.forEach(function(node){
    if(node.nodeType===3){
      if(node.textContent.trim()) paras.push({ style:"Normal", runs:[{text:node.textContent}] });
      return;
    }
    if(node.nodeType!==1) return;
    switch(node.nodeName){
      case "H1": pushBlock(node, "Heading1"); break;
      case "H2": pushBlock(node, "Heading2"); break;
      case "UL":
        node.querySelectorAll("li").forEach(function(li){ pushBlock(li, "ListParagraph", 1); });
        break;
      case "OL":
        node.querySelectorAll("li").forEach(function(li){ pushBlock(li, "ListParagraph", 2); });
        break;
      case "IMG": paras.push(imgParaFrom(node)); break;
      case "P": case "DIV": pushMixedBlock(node, "Normal"); break;
      default: pushMixedBlock(node, "Normal");
    }
  });
  if(paras.length===0) paras.push({ style:"Normal", runs:[{text:""}] });
  return paras;
}
// Assigns relationship IDs (starting at rIdStartNum) to every image paragraph,

function collectDocxImages(paras, rIdStartNum){
  var images = [];
  var ridCounter = rIdStartNum;
  paras.forEach(function(p){
    if(p.type!=="image" || !p.src) return;
    var ridStr = "rId" + (ridCounter++);
    p.rId = ridStr;
    var conv = dataUrlToBytes(p.src);
    var ext = conv.mime.indexOf("png")>=0 ? "png" : "jpeg";
    images.push({ rId:ridStr, bytes:conv.bytes, mime:conv.mime, fileName:"image"+images.length+"."+ext });
  });
  return images;
}

function buildAvDocxBlob(title, html){
  var rows = avRowsFromHtml(html);
  var bodyXml = '<w:p><w:pPr><w:pStyle w:val="Title"/></w:pPr><w:r><w:t xml:space="preserve">' + xmlEscape(title) + '</w:t></w:r></w:p>';
  function headCell(text){
    return '<w:tc><w:tcPr><w:tcW w:w="4500" w:type="dxa"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t xml:space="preserve">' + xmlEscape(text) + '</w:t></w:r></w:p></w:tc>';
  }
  function bodyCell(text){
    return '<w:tc><w:tcPr><w:tcW w:w="4500" w:type="dxa"/></w:tcPr><w:p><w:r><w:t xml:space="preserve">' + xmlEscape(text) + '</w:t></w:r></w:p></w:tc>';
  }
  bodyXml += '<w:tbl><w:tblPr><w:tblW w:w="9000" w:type="dxa"/><w:tblBorders>' +
    '<w:top w:val="single" w:sz="4"/><w:left w:val="single" w:sz="4"/><w:bottom w:val="single" w:sz="4"/><w:right w:val="single" w:sz="4"/>' +
    '<w:insideH w:val="single" w:sz="4"/><w:insideV w:val="single" w:sz="4"/></w:tblBorders></w:tblPr>' +
    '<w:tblGrid><w:gridCol w:w="4500"/><w:gridCol w:w="4500"/></w:tblGrid>' +
    '<w:tr>' + headCell("Video") + headCell("Audio") + '</w:tr>';
  rows.forEach(function(r){
    bodyXml += '<w:tr>' + bodyCell(r.left) + bodyCell(r.right) + '</w:tr>';
  });
  bodyXml += '</w:tbl>';
  var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:rPr><w:sz w:val="22"/></w:rPr></w:style>' +
    '<w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="240"/></w:pPr><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/><w:b/><w:sz w:val="40"/></w:rPr></w:style>' +
    '</w:styles>';
  return buildDocxPackage(bodyXml, styles);
}
function exportAvDocx(d){
  var blob = buildAvDocxBlob(d.title || "Untitled script", d.html || "");
  downloadBlob(blob, safeFilename(d.title) + ".docx");
}

/* ============================================================
   SCREEN: FLOWCHART EDITOR
============================================================ */
var flowConnectMode = false;
var flowConnectFrom = null;
var flowSelectedNode = null;
var flowSelectedEdge = null;

function screenFlow(root){
  var p = findProjectOfSub(nav.subprojectId);
  var s = p && getSub(p, nav.subprojectId);
  var f = s && getFlow(s, nav.flowchartId);
  if(!f){ goBack(); return; }
  flowConnectMode = false; flowConnectFrom = null; flowSelectedNode = null; flowSelectedEdge = null;

  renderHeader(root, {
    eyebrow: s.name, title: f.title || "Untitled flowchart", back:true, savePill:true,
    actions:[{ icon:"⇩", onClick:function(){ exportFlowModal(f); } }, { icon:"⋮", onClick:function(){ flowMenu(s, f); } }]
  });

  var toolbar = el("div", { class:"flow-toolbar" });
  var addSceneBtn = el("button", { class:"btn btn-ghost", onclick:function(){ addNode(f, "scene"); } }, ["+ Scene"]);
  var addBranchBtn = el("button", { class:"btn btn-ghost", onclick:function(){ addNode(f, "branch"); } }, ["◇ Decision"]);
  var connectBtn = el("button", { class:"btn btn-ghost", id:"connectBtn", onclick:function(){ toggleConnectMode(); } }, ["⇢ Link nodes"]);
  var delBtn = el("button", { class:"btn btn-ghost", onclick:function(){ deleteSelected(f); } }, ["🗑"]);
  toolbar.appendChild(addSceneBtn);
  toolbar.appendChild(addBranchBtn);
  toolbar.appendChild(connectBtn);
  toolbar.appendChild(delBtn);
  root.appendChild(toolbar);

  var banner = el("div", { class:"connect-banner", id:"connectBanner" }, ["Tap a node, then tap a second node to connect them"]);
  root.appendChild(banner);

  var main = el("main");
  var wrap = el("div", { class:"flow-canvas-wrap" });
  var GROW_MARGIN = 500;
  var GROW_STEP = 900;
  var canvasW = Math.max(1400, window.innerWidth*1.6);
  var canvasH = Math.max(1400, window.innerHeight*1.6);
  var svg = svgEl("svg", { id:"flowSvg", width:canvasW, height:canvasH, viewBox:"0 0 "+canvasW+" "+canvasH });
  wrap.appendChild(svg);
  main.appendChild(wrap);
  root.appendChild(main);

  var edgeLayer = svgEl("g", { id:"edgeLayer" });
  var nodeLayer = svgEl("g", { id:"nodeLayer" });
  svg.appendChild(edgeLayer);
  svg.appendChild(nodeLayer);

  // edgeIndex: nodeId -> array of { edge, lineEl, hitEl, bgEl, lblEl }, for cheap per-node updates while dragging
  var edgeIndex = {};

  function ensureCanvasSize(){
    var maxRight = 100, maxBottom = 100;
    f.nodes.forEach(function(n){
      maxRight = Math.max(maxRight, n.x+n.w);
      maxBottom = Math.max(maxBottom, n.y+n.h);
    });
    var neededW = maxRight + GROW_MARGIN;
    var neededH = maxBottom + GROW_MARGIN;
    var changed = false;
    if(neededW > canvasW){ canvasW = neededW + GROW_STEP; changed = true; }
    if(neededH > canvasH){ canvasH = neededH + GROW_STEP; changed = true; }
    if(changed){
      svg.setAttribute("width", canvasW);
      svg.setAttribute("height", canvasH);
      svg.setAttribute("viewBox", "0 0 "+canvasW+" "+canvasH);
    }
  }

  function toggleConnectMode(){
    flowConnectMode = !flowConnectMode;
    flowConnectFrom = null;
    connectBtn.classList.toggle("btn-primary", flowConnectMode);
    document.getElementById("connectBanner").classList.toggle("show", flowConnectMode);
    renderNodes();
  }

  function addNode(f, type){
    var n = { id:uid(), x: 60 + Math.random()*120, y: 60 + Math.random()*120, w: type==="branch"?150:170, h: type==="branch"?100:70, text: type==="branch" ? "New decision" : "New scene", type:type, linkedDocId:null };
    f.nodes.push(n); touch(f); touch(s); scheduleSave();
    ensureCanvasSize();
    renderAll();
    // scroll the new node into view
    setTimeout(function(){
      wrap.scrollTo({ left: Math.max(0, n.x - wrap.clientWidth/2), top: Math.max(0, n.y - wrap.clientHeight/2), behavior:"smooth" });
    }, 30);
  }

  function deleteSelected(f){
    if(flowSelectedNode){
      f.nodes = f.nodes.filter(function(n){ return n.id!==flowSelectedNode; });
      f.edges = f.edges.filter(function(e){ return e.from!==flowSelectedNode && e.to!==flowSelectedNode; });
      flowSelectedNode = null;
      touch(f); touch(s); scheduleSave(); renderAll();
    } else if(flowSelectedEdge){
      f.edges = f.edges.filter(function(e){ return e.id!==flowSelectedEdge; });
      flowSelectedEdge = null;
      touch(f); touch(s); scheduleSave(); renderAll();
    } else {
      showToast("Tap a node or connector to select it first");
    }
  }

  function nodeCenter(n){ return { x:n.x+n.w/2, y:n.y+n.h/2 }; }

  function edgePath(a,b){
    var ca = nodeCenter(a), cb = nodeCenter(b);
    var dx = (cb.x-ca.x)*0.5;
    return "M"+ca.x+","+ca.y+" C"+(ca.x+dx)+","+ca.y+" "+(cb.x-dx)+","+cb.y+" "+cb.x+","+cb.y;
  }

  function renderEdges(){
    clear(edgeLayer);
    edgeIndex = {};
    var defs = svgEl("defs");
    defs.innerHTML = '<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4A5170"/></marker>';
    edgeLayer.appendChild(defs);
    f.edges.forEach(function(e){
      var a = f.nodes.find(function(n){ return n.id===e.from; });
      var b = f.nodes.find(function(n){ return n.id===e.to; });
      if(!a||!b) return;
      var d = edgePath(a,b);
      var hit = svgEl("path", { d:d, class:"fedge-hit" });
      var line = svgEl("path", { d:d, class:"fedge-line" + (flowSelectedEdge===e.id?" selected":""), "marker-end":"url(#arrow)" });
      hit.addEventListener("click", function(evt){ evt.stopPropagation(); flowSelectedEdge=e.id; flowSelectedNode=null; renderAll(); });
      edgeLayer.appendChild(line);
      edgeLayer.appendChild(hit);
      var bg=null, lbl=null;
      if(e.label){
        var mid = { x:(a.x+a.w/2+b.x+b.w/2)/2, y:(a.y+a.h/2+b.y+b.h/2)/2 };
        bg = svgEl("rect", { x:mid.x-30, y:mid.y-10, width:60, height:18, rx:4, class:"fedge-label-bg" });
        lbl = svgEl("text", { x:mid.x, y:mid.y+3, "text-anchor":"middle", class:"fedge-label" });
        lbl.textContent = e.label;
        edgeLayer.appendChild(bg);
        edgeLayer.appendChild(lbl);
      }
      var rec = { edge:e, a:a, b:b, lineEl:line, hitEl:hit, bgEl:bg, lblEl:lbl };
      (edgeIndex[a.id] = edgeIndex[a.id]||[]).push(rec);
      (edgeIndex[b.id] = edgeIndex[b.id]||[]).push(rec);
    });
  }

  // Lightweight update used during drag: only recompute paths for edges touching the moved node
  function updateEdgesTouchingNode(nodeId){
    var list = edgeIndex[nodeId];
    if(!list) return;
    list.forEach(function(rec){
      var d = edgePath(rec.a, rec.b);
      rec.lineEl.setAttribute("d", d);
      rec.hitEl.setAttribute("d", d);
      if(rec.bgEl && rec.lblEl){
        var mid = { x:(rec.a.x+rec.a.w/2+rec.b.x+rec.b.w/2)/2, y:(rec.a.y+rec.a.h/2+rec.b.y+rec.b.h/2)/2 };
        rec.bgEl.setAttribute("x", mid.x-30); rec.bgEl.setAttribute("y", mid.y-10);
        rec.lblEl.setAttribute("x", mid.x); rec.lblEl.setAttribute("y", mid.y+3);
      }
    });
  }

  function renderNodes(){
    clear(nodeLayer);
    f.nodes.forEach(function(n){
      var g = svgEl("g", { class:"fnode " + n.type + (flowSelectedNode===n.id?" selected":""), transform:"translate("+n.x+","+n.y+")" });
      var hasImage = !!n.image && n.type!=="branch";
      var imgH = hasImage ? Math.min(70, n.h*0.6) : 0;
      if(n.type==="branch"){
        var pts = [n.w/2+",0", n.w+","+(n.h/2), n.w/2+","+n.h, "0,"+(n.h/2)].join(" ");
        g.appendChild(svgEl("polygon", { points:pts }));
      } else {
        g.appendChild(svgEl("rect", { width:n.w, height:n.h, rx:12 }));
      }
      if(hasImage){
        var clipId = "clip-"+n.id;
        var defsClip = svgEl("defs");
        var clipPath = svgEl("clipPath", { id:clipId });
        clipPath.appendChild(svgEl("rect", { x:2, y:2, width:n.w-4, height:imgH-2, rx:10 }));
        defsClip.appendChild(clipPath);
        g.appendChild(defsClip);
        var img = svgEl("image", { x:2, y:2, width:n.w-4, height:imgH-2, href:n.image, preserveAspectRatio:"xMidYMid slice", "clip-path":"url(#"+clipId+")" });
        img.setAttributeNS("http://www.w3.org/1999/xlink", "href", n.image);
        g.appendChild(img);
      }
      var textY = hasImage ? imgH + 16 : (n.type==="branch" ? n.h/2 : n.h/2 - (n.linkedDocId?6:0));
      var label = svgEl("text", { x:n.w/2, y:textY, "text-anchor":"middle" });
      var txt = n.text.length>22 ? n.text.slice(0,21)+"…" : n.text;
      label.textContent = txt;
      g.appendChild(label);
      if(n.linkedDocId){
        var docRef = s.docs.find(function(dd){ return dd.id===n.linkedDocId; });
        var subLabel = svgEl("text", { x:n.w/2, y:textY+14, "text-anchor":"middle", class:"flabel-sub" });
        subLabel.textContent = "📄 " + (docRef ? (docRef.title||"page") : "linked");
        g.appendChild(subLabel);
      }
      nodeLayer.appendChild(g);
      attachNodeInteractions(g, n);
    });
  }

  function attachNodeInteractions(g, n){
    var dragging = false, moved = false, startX, startY, origX, origY, pointerId;
    var rafPending = false, pendingX = 0, pendingY = 0;

    function applyFrame(){
      rafPending = false;
      n.x = Math.max(20, pendingX);
      n.y = Math.max(20, pendingY);
      g.setAttribute("transform","translate("+n.x+","+n.y+")");
      updateEdgesTouchingNode(n.id);
      ensureCanvasSize();
    }

    g.addEventListener("pointerdown", function(evt){
      evt.stopPropagation();
      pointerId = evt.pointerId;
      g.setPointerCapture(pointerId);
      dragging = true; moved = false;
      var pt = svgPoint(evt);
      startX = pt.x; startY = pt.y; origX = n.x; origY = n.y;
    });
    g.addEventListener("pointermove", function(evt){
      if(!dragging) return;
      var pt = svgPoint(evt);
      var dx = pt.x-startX, dy = pt.y-startY;
      if(Math.abs(dx)>3||Math.abs(dy)>3) moved = true;
      if(moved){
        pendingX = origX+dx; pendingY = origY+dy;
        if(!rafPending){
          rafPending = true;
          requestAnimationFrame(applyFrame);
        }
      }
    });
    g.addEventListener("pointerup", function(evt){
      dragging = false;
      try{ g.releasePointerCapture(pointerId); }catch(e){}
      if(moved){
        touch(f); touch(s); scheduleSave();
      } else {
        handleNodeTap(n);
      }
    });
  }

  function svgPoint(evt){
    var rect = svg.getBoundingClientRect();
    var scaleX = svg.viewBox.baseVal.width / rect.width;
    var scaleY = svg.viewBox.baseVal.height / rect.height;
    return { x:(evt.clientX-rect.left)*scaleX, y:(evt.clientY-rect.top)*scaleY };
  }

  function handleNodeTap(n){
    if(flowConnectMode){
      if(!flowConnectFrom){
        flowConnectFrom = n.id;
        showToast("Now tap the node to connect to");
      } else if(flowConnectFrom!==n.id){
        var exists = f.edges.some(function(e){ return e.from===flowConnectFrom && e.to===n.id; });
        if(!exists){
          f.edges.push({ id:uid(), from:flowConnectFrom, to:n.id, label:"" });
          touch(f); touch(s); scheduleSave();
        }
        flowConnectFrom = null;
        renderAll();
      }
      return;
    }
    flowSelectedNode = n.id; flowSelectedEdge = null;
    renderAll();
    openNodeEditor(n);
  }

  function openNodeEditor(n){
    var docOptions = [{ value:"", label:"— No linked page —" }].concat(
      s.docs.map(function(dd){ return { value:dd.id, label:dd.title||"Untitled page" }; })
    );
    var pendingImage = n.image || null; // data URL staged until Save
    var imgPreviewWrap = el("div", {});
    function renderImgPreview(){
      clear(imgPreviewWrap);
      if(pendingImage){
        var img = el("img", { src:pendingImage, style:"max-width:100%; border-radius:8px; display:block; margin-bottom:8px;" });
        var removeBtn = el("button", { class:"btn btn-ghost", style:"padding:8px 10px; font-size:12px;", onclick:function(){ pendingImage = null; renderImgPreview(); } }, ["Remove image"]);
        imgPreviewWrap.appendChild(img);
        imgPreviewWrap.appendChild(removeBtn);
      }
    }
    renderImgPreview();
    var imgFileInput = el("input", { type:"file", accept:"image/*", style:"display:none" });
    imgFileInput.addEventListener("change", function(){
      var file = imgFileInput.files && imgFileInput.files[0];
      if(!file) return;
      showToast("Adding image…");
      readAndCompressImage(file, 500, 0.8).then(function(res){
        pendingImage = res.dataUrl;
        renderImgPreview();
      }).catch(function(){ showToast("Couldn't add that image"); });
      imgFileInput.value = "";
    });
    var imgSection = el("div", {}, [
      el("div", { class:"field-label" }, ["Image"]),
      imgPreviewWrap,
      imgFileInput,
      el("button", { class:"btn btn-ghost", style:"margin-top:4px;", onclick:function(){ imgFileInput.click(); } }, ["🖼 " + (pendingImage?"Replace image":"Add image")])
    ]);
    openModal({
      title: n.type==="branch" ? "Decision point" : "Scene node",
      fields:[
        { key:"text", label:"Text", type:"textarea", value:n.text, rows:2 },
        { key:"linkedDocId", label:"Linked page", type:"select", value:n.linkedDocId||"", options:docOptions }
      ],
      body: imgSection,
      actions:[
        { label:"Cancel", style:"btn-ghost" },
        { label:"Open linked page", style:"btn-ghost", onClick:function(){
          if(n.linkedDocId){
            var dd = s.docs.find(function(x){ return x.id===n.linkedDocId; });
            if(dd) setTimeout(function(){ goTo({screen: dd.kind==="script"?"script":"doc", subprojectId:s.id, docId:dd.id}); }, 60);
          } else { showToast("No page linked yet"); return false; }
        }},
        { label:"Save", style:"btn-primary", onClick:function(v){
          n.text = v.text.trim() || (n.type==="branch"?"Decision":"Scene");
          n.linkedDocId = v.linkedDocId || null;
          n.image = pendingImage || null;
          if(n.image && n.type==="scene" && n.h < 140) n.h = 140;
          touch(f); touch(s); scheduleSave();
          ensureCanvasSize();
          renderAll();
        }}
      ]
    });
  }

  svg.addEventListener("click", function(evt){
    if(evt.target===svg){ flowSelectedNode=null; flowSelectedEdge=null; renderAll(); }
  });

  function renderAll(){ renderEdges(); renderNodes(); }
  ensureCanvasSize();
  renderAll();

  if(nav.focusNodeId){
    var focusNode = f.nodes.find(function(n){ return n.id===nav.focusNodeId; });
    if(focusNode){
      flowSelectedNode = focusNode.id;
      renderAll();
      setTimeout(function(){
        wrap.scrollTo({ left: Math.max(0, focusNode.x - wrap.clientWidth/2), top: Math.max(0, focusNode.y - wrap.clientHeight/2), behavior:"smooth" });
      }, 30);
    }
    nav.focusNodeId = null;
  }
}

/* ============================================================
   FLOWCHART EXPORT
============================================================ */
function exportFlowModal(f){
  openModal({
    title:"Export \"" + (f.title||"Untitled flowchart") + "\"",
    center:true, vertical:true,
    actions:[
      { label:"🖼  PNG image", style:"btn-ghost", onClick:function(){ exportFlowPng(f); } },
      { label:"🖨  PDF (print)", style:"btn-ghost", onClick:function(){ exportFlowPdf(f); } },
      { label:"{ }  JSON (backup / re-import)", style:"btn-ghost", onClick:function(){ exportFlowJson(f); } }
    ]
  });
}
function computeFlowBounds(f){
  if(f.nodes.length===0) return { minX:0,minY:0,maxX:400,maxY:300 };
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  f.nodes.forEach(function(n){
    minX=Math.min(minX,n.x); minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h);
  });
  return { minX:minX-40, minY:minY-40, maxX:maxX+40, maxY:maxY+40 };
}
function buildStandaloneFlowSvgString(f, subDocs){
  var b = computeFlowBounds(f);
  var w = b.maxX-b.minX, h = b.maxY-b.minY;
  var parts = [];
  parts.push('<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="'+b.minX+' '+b.minY+' '+w+' '+h+'" font-family="Helvetica,Arial,sans-serif">');
  parts.push('<rect x="'+b.minX+'" y="'+b.minY+'" width="'+w+'" height="'+h+'" fill="#14161C"/>');
  parts.push('<defs><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8A90A8"/></marker></defs>');
  function center(n){ return { x:n.x+n.w/2, y:n.y+n.h/2 }; }
  f.edges.forEach(function(e){
    var a = f.nodes.find(function(n){ return n.id===e.from; });
    var b2 = f.nodes.find(function(n){ return n.id===e.to; });
    if(!a||!b2) return;
    var ca=center(a), cb=center(b2);
    var dx=(cb.x-ca.x)*0.5;
    parts.push('<path d="M'+ca.x+','+ca.y+' C'+(ca.x+dx)+','+ca.y+' '+(cb.x-dx)+','+cb.y+' '+cb.x+','+cb.y+'" stroke="#8A90A8" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>');
  });
  f.nodes.forEach(function(n){
    var hasImage = !!n.image && n.type!=="branch";
    var imgH = hasImage ? Math.min(70, n.h*0.6) : 0;
    if(n.type==="branch"){
      var pts = [(n.x+n.w/2)+","+n.y, (n.x+n.w)+","+(n.y+n.h/2), (n.x+n.w/2)+","+(n.y+n.h), n.x+","+(n.y+n.h/2)].join(" ");
      parts.push('<polygon points="'+pts+'" fill="#2E2618" stroke="#E8A33D" stroke-width="2"/>');
    } else {
      parts.push('<rect x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" rx="12" fill="#232838" stroke="#3E4560" stroke-width="2"/>');
    }
    if(hasImage){
      var clipId = "exclip-"+n.id;
      parts.push('<clipPath id="'+clipId+'"><rect x="'+(n.x+2)+'" y="'+(n.y+2)+'" width="'+(n.w-4)+'" height="'+(imgH-2)+'" rx="10"/></clipPath>');
      parts.push('<image x="'+(n.x+2)+'" y="'+(n.y+2)+'" width="'+(n.w-4)+'" height="'+(imgH-2)+'" href="'+n.image+'" preserveAspectRatio="xMidYMid slice" clip-path="url(#'+clipId+')"/>');
    }
    var cx = n.x+n.w/2;
    var textY = hasImage ? (n.y+imgH+16) : (n.linkedDocId ? (n.y+n.h/2-4) : (n.y+n.h/2+4));
    var txt = xmlEscape(n.text||"");
    parts.push('<text x="'+cx+'" y="'+textY+'" text-anchor="middle" fill="#EDEAE2" font-size="14">'+txt+'</text>');
    if(n.linkedDocId){
      var docRef = subDocs.find(function(dd){ return dd.id===n.linkedDocId; });
      parts.push('<text x="'+cx+'" y="'+(textY+14)+'" text-anchor="middle" fill="#8B90A0" font-size="11">linked: '+xmlEscape(docRef?docRef.title:"page")+'</text>');
    }
  });
  parts.push('</svg>');
  return parts.join("");
}
function exportFlowPng(f){
  var p = findProjectOfSub(nav.subprojectId);
  var s = p && getSub(p, nav.subprojectId);
  var svgStr = buildStandaloneFlowSvgString(f, s.docs);
  var b = computeFlowBounds(f);
  var img = new Image();
  var svgBlob = new Blob([svgStr], { type:"image/svg+xml;charset=utf-8" });
  var url = URL.createObjectURL(svgBlob);
  img.onload = function(){
    var scale = 2;
    var canvas = document.createElement("canvas");
    canvas.width = (b.maxX-b.minX)*scale;
    canvas.height = (b.maxY-b.minY)*scale;
    var ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    canvas.toBlob(function(blob){
      downloadBlob(blob, safeFilename(f.title) + ".png");
    });
  };
  img.onerror = function(){ showToast("PNG export failed — try JSON export instead"); URL.revokeObjectURL(url); };
  img.src = url;
}
function exportFlowPdf(f){
  var p = findProjectOfSub(nav.subprojectId);
  var s = p && getSub(p, nav.subprojectId);
  var svgStr = buildStandaloneFlowSvgString(f, s.docs);
  var pa = document.getElementById("printArea");
  clear(pa);
  var h = document.createElement("h1");
  h.style.fontFamily = "Georgia,serif";
  h.style.color = "#000";
  h.textContent = f.title || "Untitled flowchart";
  pa.appendChild(h);
  var holder = document.createElement("div");
  holder.style.background = "#14161C";
  holder.style.padding = "10px";
  holder.innerHTML = svgStr;
  pa.appendChild(holder);
  document.title = safeFilename(f.title);
  setTimeout(function(){ window.print(); }, 80);
}
function exportFlowJson(f){
  var blob = new Blob([JSON.stringify(f, null, 2)], { type:"application/json" });
  downloadBlob(blob, safeFilename(f.title) + ".json");
}

/* ============================================================
   MAIN RENDER DISPATCH
============================================================ */
function render(){
  var root = document.getElementById("app");
  clear(root);
  switch(nav.screen){
    case "home": screenHome(root); break;
    case "project": screenProject(root); break;
    case "subproject": screenSubproject(root); break;
    case "doc": screenDoc(root); break;
    case "script": screenScript(root); break;
    case "flow": screenFlow(root); break;
    default: screenHome(root);
  }
}

/* ============================================================
   BOOT
============================================================ */
state = loadState();
render();

window.addEventListener("beforeunload", function(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
});

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(e){ console.warn("SW registration failed", e); });
  });
}

})();
</script>
